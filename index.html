<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LA JOSEFINA SRL · Registro de Operaciones</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;background:#f4f7f4;font-family:'Inter',sans-serif;color:#1a2e1a;font-size:14px;}
.header{background:#fff;border-bottom:3px solid #16a34a;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:0 20px;}
.header-inner{max-width:720px;margin:0 auto;}
.brand-row{display:flex;align-items:center;gap:16px;padding:16px 0 12px;}
.logo-img{width:60px;height:60px;object-fit:contain;}
.brand-name{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:3px;color:#15803d;line-height:1;}
.brand-sub{font-size:11px;color:#86b893;margin-top:2px;}
.brand-title{font-size:12px;font-weight:600;color:#166534;margin-top:4px;padding-top:4px;border-top:1px solid #d1fae5;}
.tabs{display:flex;border-top:1px solid #f0f0f0;}
.tab-btn{flex:1;cursor:pointer;border:none;background:none;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;padding:11px;color:#6b7280;border-bottom:3px solid transparent;transition:all .2s;}
.tab-btn.active{color:#16a34a;border-bottom:3px solid #16a34a;}
.tab-btn:hover{color:#16a34a;}
.main{max-width:720px;margin:0 auto;padding:20px;}
.card{background:#fff;border:1px solid #d1fae5;border-radius:10px;padding:20px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.card-title{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#16a34a;display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.num-badge{background:#f0fdf4;color:#22c55e;font-family:'Bebas Neue',sans-serif;font-size:22px;width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;line-height:1;}
label{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#6b7280;display:block;margin-bottom:5px;}
input[type=date],input[type=time],input[type=number],select,textarea{width:100%;background:#f9fafb;border:1.5px solid #e5e7eb;border-radius:8px;padding:10px 14px;color:#111827;font-family:'Inter',sans-serif;font-size:14px;transition:border .2s;}
input:focus,select:focus,textarea:focus{border-color:#16a34a;outline:none;background:#fff;box-shadow:0 0 0 3px rgba(22,163,74,.1);}
select{background-color:#f9fafb;}
textarea{resize:vertical;min-height:80px;line-height:1.5;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
@media(max-width:560px){.grid-2,.grid-3{grid-template-columns:1fr;}}
.tipo-group{display:flex;gap:10px;}
.tipo-btn{flex:1;padding:11px;border-radius:8px;border:1.5px solid #e5e7eb;background:#f9fafb;color:#6b7280;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center;}
.tipo-btn:hover{border-color:#16a34a;color:#16a34a;background:#f0fdf4;}
.tipo-btn.sel-total{background:#f0fdf4;border-color:#16a34a;color:#15803d;}
.tipo-btn.sel-selectiva{background:#fffbeb;border-color:#d97706;color:#b45309;}
.prod-card{background:#f9fafb;border:1.5px solid #e5e7eb;border-radius:8px;padding:14px 14px 14px 40px;margin-bottom:10px;position:relative;}
.prod-num{position:absolute;top:10px;right:12px;font-family:'Bebas Neue',sans-serif;font-size:22px;color:#d1fae5;line-height:1;}
.btn-rm{position:absolute;top:10px;left:10px;background:none;border:none;color:#fca5a5;font-size:20px;cursor:pointer;line-height:1;padding:0;transition:color .2s;}
.btn-rm:hover{color:#ef4444;}
.search-wrap{position:relative;margin-bottom:12px;}
.search-inp{width:100%;background:#fff;border:1.5px solid #e5e7eb;border-radius:8px;padding:10px 14px;font-family:'Inter',sans-serif;font-size:14px;color:#111827;}
.search-inp:focus{border-color:#16a34a;outline:none;box-shadow:0 0 0 3px rgba(22,163,74,.1);}
.drop{position:absolute;top:calc(100% + 3px);left:0;right:0;background:#fff;border:1.5px solid #16a34a;border-radius:8px;max-height:190px;overflow-y:auto;z-index:9999;box-shadow:0 6px 20px rgba(0,0,0,.12);display:none;}
.drop.open{display:block;}
.drop-item{padding:9px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid #f0fdf4;color:#374151;}
.drop-item:hover{background:#f0fdf4;color:#16a34a;}
.diff-display{width:100%;background:#fff;border:1.5px solid #e5e7eb;border-radius:8px;padding:10px 14px;font-size:15px;font-weight:700;text-align:center;min-height:43px;display:flex;align-items:center;justify-content:center;color:#9ca3af;}
.btn-add-prod{width:100%;background:#f0fdf4;border:1.5px dashed #4ade80;border-radius:8px;color:#16a34a;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;padding:10px;cursor:pointer;margin-top:4px;transition:all .2s;}
.btn-add-prod:hover{background:#dcfce7;}
.btn-save{width:100%;background:linear-gradient(135deg,#15803d,#16a34a);border:none;border-radius:10px;color:#fff;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:15px;cursor:pointer;box-shadow:0 4px 14px rgba(22,163,74,.3);transition:all .2s;}
.btn-save:hover{transform:translateY(-1px);}
.btn-save:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.hint{text-align:center;font-size:11px;color:#9ca3af;margin-top:8px;}
.view{display:none;}.view.active{display:block;}
.reg-card{background:#fff;border:1px solid #d1fae5;border-radius:10px;padding:16px;margin-bottom:10px;}
.reg-lote{font-weight:700;font-size:15px;color:#15803d;}
.reg-meta{font-size:11px;color:#9ca3af;margin-top:2px;}
.badge{font-size:10px;font-weight:600;padding:4px 12px;border-radius:20px;}
.badge-t{background:#dcfce7;color:#15803d;border:1px solid #86efac;}
.badge-s{background:#fef3c7;color:#b45309;border:1px solid #fcd34d;}
.prod-table{margin-top:10px;border-top:1px solid #f0fdf4;padding-top:8px;}
.pt-head{display:grid;grid-template-columns:1fr 72px 72px 72px;gap:6px;font-size:10px;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:1px;padding:0 4px;margin-bottom:4px;}
.pt-row{display:grid;grid-template-columns:1fr 72px 72px 72px;gap:6px;font-size:12px;padding:5px 4px;border-bottom:1px solid #f9fafb;align-items:center;}
.obs-wrap{margin-top:10px;border-top:1px solid #f0fdf4;padding-top:10px;}
.obs-ttl{font-size:10px;font-weight:600;color:#16a34a;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
.obs-body{font-size:12px;color:#4b5563;line-height:1.5;background:#f0fdf4;border-left:3px solid #4ade80;border-radius:0 6px 6px 0;padding:8px 12px;}
.reg-actions{display:flex;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid #f0fdf4;}
.btn-act{background:none;border:1.5px solid;border-radius:7px;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;padding:6px 14px;cursor:pointer;transition:all .2s;}
.btn-p{border-color:#86efac;color:#15803d;}.btn-p:hover{background:#f0fdf4;}
.btn-d{border-color:#fca5a5;color:#ef4444;}.btn-d:hover{background:#fef2f2;}
.filter-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
.btn-exp{background:#f0fdf4;border:1.5px solid #86efac;border-radius:8px;color:#15803d;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;padding:8px 16px;cursor:pointer;}
.btn-exp:hover{background:#dcfce7;}
.empty{text-align:center;padding:50px 0;color:#9ca3af;}
.empty-title{font-family:'Bebas Neue',sans-serif;font-size:44px;color:#d1fae5;margin-bottom:6px;}
#toast{position:fixed;bottom:24px;right:24px;background:#15803d;border-radius:10px;padding:14px 24px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9999;box-shadow:0 8px 24px rgba(22,163,74,.4);}
#toast.show{opacity:1;}
.toast-t{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#fff;letter-spacing:3px;}
.toast-s{font-size:10px;color:#bbf7d0;margin-top:2px;text-transform:uppercase;letter-spacing:2px;}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="brand-row">
      <img class="logo-img" id="logo-img" src="" alt="La Josefina SRL"/>
      <div>
        <div class="brand-name">LA JOSEFINA SRL</div>
        <div class="brand-sub">Campaña 26 / 27</div>
        <div class="brand-title">Registro de Operaciones</div>
      </div>
    </div>
    <div class="tabs">
      <button type="button" class="tab-btn active" onclick="switchTab('form',this)">+ Nueva Operación</button>
      <button type="button" class="tab-btn" id="tab-hist" onclick="switchTab('hist',this)">Historial</button>
    </div>
  </div>
</div>

<div class="main">

  <div id="view-form" class="view active">

    <div class="card">
      <div class="card-title"><span class="num-badge">01</span> Fecha y Horario</div>
      <div class="grid-2">
        <div><label>Fecha</label><input type="date" id="f-fecha" oninput="checkSave()"/></div>
        <div><label>Horario de inicio</label><input type="time" id="f-horario"/></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="num-badge">02</span> Lote</div>
      <label>Seleccionar lote</label>
      <select id="f-lote" onchange="checkSave()">
        <option value="">— Elegir lote —</option>
      </select>
    </div>

    <div class="card">
      <div class="card-title"><span class="num-badge">03</span> Tipo de Aplicación</div>
      <div class="tipo-group">
        <button type="button" class="tipo-btn" id="btn-total" onclick="setTipo('Total')">&#9632; Total</button>
        <button type="button" class="tipo-btn" id="btn-sel" onclick="setTipo('Selectiva')">&#9670; Selectiva</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="num-badge">04</span> Productos</div>
      <div id="prods-wrap"></div>
      <button type="button" class="btn-add-prod" id="btn-add-prod">+ Agregar producto</button>
    </div>

    <div class="card">
      <div class="card-title"><span class="num-badge">05</span> Observaciones</div>
      <label>Notas adicionales (opcional)</label>
      <textarea id="f-obs" placeholder="Condiciones climaticas, incidencias, notas de campo..."></textarea>
    </div>

    <button type="button" class="btn-save" id="btn-save" disabled>Guardar Registro</button>
    <p class="hint" id="hint">Completa fecha, lote y tipo de aplicacion para guardar</p>
  </div>

  <div id="view-hist" class="view">
    <div class="filter-bar">
      <span style="font-size:12px;color:#9ca3af;font-weight:500;" id="hist-cnt">0 registros</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <select id="hist-filt" style="min-width:180px;" onchange="renderHist()">
          <option value="">Todos los lotes</option>
        </select>
        <button type="button" class="btn-exp" id="btn-exp-all">&#8595; Exportar PDF</button>
      </div>
    </div>
    <div id="hist-wrap"></div>
  </div>
</div>

<div id="toast"><div class="toast-t">OK</div><div class="toast-s">Registro guardado</div></div>

// Poblar selects
function poblarSelects() {
  var ids = ['f-lote', 'hist-filt'];
  for (var s = 0; s < ids.length; s++) {
    var sel = document.getElementById(ids[s]);
    for (var i = 0; i < LOTES.length; i++) {
      var o = document.createElement('option');
      o.value = LOTES[i];
      o.textContent = LOTES[i];
      sel.appendChild(o);
    }
  }
}

function init() {
  poblarSelects();
  document.getElementById('f-fecha').value = new Date().toISOString().slice(0, 10);
  document.getElementById('btn-add-prod').addEventListener('click', addProd);
  document.getElementById('btn-save').addEventListener('click', guardar);
  document.getElementById('btn-exp-all').addEventListener('click', expAll);
  addProd();
  updTab();
}

function switchTab(name, btn) {
  var views = document.querySelectorAll('.view');
  for (var i = 0; i < views.length; i++) views[i].classList.remove('active');
  var tabs = document.querySelectorAll('.tab-btn');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
  document.getElementById('view-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'hist') renderHist();
}

function setTipo(t) {
  tipo = t;
  document.getElementById('btn-total').className = 'tipo-btn' + (t === 'Total' ? ' sel-total' : '');
  document.getElementById('btn-sel').className = 'tipo-btn' + (t === 'Selectiva' ? ' sel-selectiva' : '');
  checkSave();
}

  html2 += '<label>Insumo / Producto</label>';
  html2 += '<input id="pi-' + i + '" placeholder="Escribi para buscar..." autocomplete="off"';
  html2 += ' style="width:100%;background:#fff;border:1.5px solid #e5e7eb;border-radius:8px;padding:10px 14px;font-size:14px;font-family:Inter,sans-serif;color:#111827"/>';
  html2 += '<div id="dr-' + i + '" style="display:none;position:absolute;left:0;right:0;background:#fff;border:1.5px solid #16a34a;border-radius:8px;max-height:180px;overflow-y:auto;z-index:9999;box-shadow:0 6px 20px rgba(0,0,0,.15);"></div>';
  html2 += '</div>';

  // CANTIDADES - seccion completamente separada, sin ningun dropdown cerca
  html2 += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">';
  html2 += '<div>';
  html2 += '<label>Cargado</label>';
  html2 += '<input id="pc-' + i + '" data-idx="' + i + '" placeholder="0.00"';
  html2 += ' style="width:100%;background:#fff;border:2px solid #86efac;border-radius:8px;padding:12px;font-size:16px;font-family:Inter,sans-serif;color:#111827"/>';
  html2 += '</div>';
  html2 += '<div>';
  html2 += '<label>Utilizado</label>';
  html2 += '<input id="pu-' + i + '" data-idx="' + i + '" placeholder="0.00"';
  html2 += ' style="width:100%;background:#fff;border:2px solid #86efac;border-radius:8px;padding:12px;font-size:16px;font-family:Inter,sans-serif;color:#111827"/>';
  html2 += '</div>';
  html2 += '<div>';
  html2 += '<label>Diferencia</label>';
  html2 += '<div id="pd-' + i + '" style="background:#f9fafb;border:2px solid #e5e7eb;border-radius:8px;padding:12px;font-size:16px;font-weight:700;text-align:center;color:#9ca3af">-</div>';
  html2 += '</div>';
  html2 += '</div>';

  d.innerHTML = html2;
  d.style.position = 'relative';
  document.getElementById('prods-wrap').appendChild(d);

  // Eventos buscador - solo input, sin blur
  document.getElementById('pi-' + i).addEventListener('input', function() {
    mostrarOpciones(i);
  });
  document.getElementById('pi-' + i).addEventListener('click', function() {
    mostrarOpciones(i);
  });

  // Eventos cantidades - totalmente independientes
  document.getElementById('pc-' + i).addEventListener('input', function() {
    recalcular(i);
  });
  document.getElementById('pu-' + i).addEventListener('input', function() {
    recalcular(i);
  });

  // Eliminar producto
  d.querySelector('.btn-rm').addEventListener('click', function(e) {
    e.stopPropagation();
    rmProd(i);
  });

  renum();
}

function rmProd(i) {
  var cards = document.querySelectorAll('.prod-card');
  if (cards.length <= 1) return;
  var el = document.getElementById('pd-' + i);
  if (el) el.remove();
  renum();
}

function renum() {
  var cards = document.querySelectorAll('.prod-card');
  for (var i = 0; i < cards.length; i++) {
    var n = cards[i].querySelector('[id^="pn-"]');
    if (n) n.textContent = '#' + (i + 1 < 10 ? '0' + (i + 1) : '' + (i + 1));
  }
}

function mostrarOpciones(i) {
  var inp = document.getElementById('pi-' + i);
  var dr  = document.getElementById('dr-' + i);
  if (!inp || !dr) return;
  var q = inp.value.toLowerCase().trim();
  if (!q) { dr.style.display = 'none'; return; }
  var hits = [];
  for (var j = 0; j < INSUMOS.length; j++) {
    if (INSUMOS[j].toLowerCase().indexOf(q) !== -1) {
      hits.push(INSUMOS[j]);
      if (hits.length >= 14) break;
    }
  }
  if (!hits.length) { dr.style.display = 'none'; return; }
  dr.innerHTML = '';
  for (var k = 0; k < hits.length; k++) {
    var item = document.createElement('div');
    item.textContent = hits[k];
    item.style.cssText = 'padding:9px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid #f0fdf4;color:#374151;';
    item.addEventListener('mousedown', (function(val, idx) {
      return function(e) {
        e.preventDefault();
        e.stopPropagation();
        document.getElementById('pi-' + idx).value = val;
        document.getElementById('dr-' + idx).style.display = 'none';
      };
    })(hits[k], i));
    item.addEventListener('mouseover', function() { this.style.background = '#f0fdf4'; this.style.color = '#16a34a'; });
    item.addEventListener('mouseout',  function() { this.style.background = ''; this.style.color = '#374151'; });
    dr.appendChild(item);
  }
  dr.style.display = 'block';
}

// Cerrar dropdowns al hacer click fuera
document.addEventListener('click', function(e) {
  var cards = document.querySelectorAll('.prod-card');
  for (var c = 0; c < cards.length; c++) {
    var idx = cards[c].id.replace('pd-', '');
    var dr = document.getElementById('dr-' + idx);
    var pi = document.getElementById('pi-' + idx);
    if (dr && pi && !pi.contains(e.target)) {
      dr.style.display = 'none';
    }
  }
});

function recalcular(i) {
  var cEl = document.getElementById('pc-' + i);
  var uEl = document.getElementById('pu-' + i);
  var bEl = document.getElementById('pd-' + i);
  if (!cEl || !uEl || !bEl) return;
  var c = parseFloat(cEl.value.replace(',', '.'));
  var u = parseFloat(uEl.value.replace(',', '.'));
  if (isNaN(c) || isNaN(u)) { bEl.textContent = '-'; bEl.style.color = '#9ca3af'; return; }
  var d = c - u;
  bEl.textContent = d > 0 ? '+' + d.toFixed(2) : d.toFixed(2);
  bEl.style.color = d > 0 ? '#16a34a' : d < 0 ? '#ef4444' : '#d97706';
}

function calcDiff(i) { recalcular(i); }

function checkSave() {
  var ok = document.getElementById('f-fecha').value &&
           document.getElementById('f-lote').value &&
           tipo;
  document.getElementById('btn-save').disabled = !ok;
  document.getElementById('hint').style.display = ok ? 'none' : 'block';
}

document.getElementById('f-lote').addEventListener('change', checkSave);
document.getElementById('f-fecha').addEventListener('input', checkSave);

function guardar() {
  var prods = [];
  var cards = document.querySelectorAll('.prod-card');
  for (var ci = 0; ci < cards.length; ci++) {
    var idx = cards[ci].id.replace('pd-', '');
    var ins = (document.getElementById('pi-' + idx) || {}).value || '';
    var car = ((document.getElementById('pc-' + idx) || {}).value || '').replace(',', '.');
    var uti = ((document.getElementById('pu-' + idx) || {}).value || '').replace(',', '.');
    if (ins || car || uti) prods.push({ ins: ins, car: car, uti: uti });
  }
  var reg = {
    id: Date.now(),
    fecha: document.getElementById('f-fecha').value,
    horario: document.getElementById('f-horario').value,
    lote: document.getElementById('f-lote').value,
    tipo: tipo,
    prods: prods,
    obs: document.getElementById('f-obs').value.trim()
  };
  recs.unshift(reg);
  localStorage.setItem('lj_recs', JSON.stringify(recs));
  updTab();
  showToast();
  reset();
}

function reset() {
  document.getElementById('f-fecha').value = new Date().toISOString().slice(0, 10);
  document.getElementById('f-horario').value = '';
  document.getElementById('f-lote').value = '';
  document.getElementById('f-obs').value = '';
  tipo = '';
  document.getElementById('btn-total').className = 'tipo-btn';
  document.getElementById('btn-sel').className = 'tipo-btn';
  document.getElementById('prods-wrap').innerHTML = '';
  pc = 0;
  addProd();
  checkSave();
}

function showToast() {
  var t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}

function updTab() {
  document.getElementById('tab-hist').textContent = 'Historial' + (recs.length ? ' (' + recs.length + ')' : '');
}

function renderHist() {
  var f = document.getElementById('hist-filt').value;
  var list = f ? recs.filter(function(r) { return r.lote === f; }) : recs;
  document.getElementById('hist-cnt').textContent = list.length + ' registro' + (list.length !== 1 ? 's' : '');
  var w = document.getElementById('hist-wrap');
  if (!list.length) {
    w.innerHTML = '<div class="empty"><div class="empty-title">SIN DATOS</div><p>' +
      (f ? 'No hay registros para este lote' : 'Todavia no hay registros guardados') + '</p></div>';
    return;
  }
  var html = '';
  for (var ri = 0; ri < list.length; ri++) {
    var r = list[ri];
    var hora = r.horario ? ' · ' + r.horario + 'hs' : '';
    var bc = r.tipo === 'Total' ? 'badge-t' : 'badge-s';
    var pRows = '';
    var filtProds = (r.prods || []).filter(function(p) { return p.ins; });
    for (var pi = 0; pi < filtProds.length; pi++) {
      var p = filtProds[pi];
      var c = parseFloat(p.car), u = parseFloat(p.uti);
      var d = (!isNaN(c) && !isNaN(u)) ? (c - u) : null;
      var dc = d === null ? '#9ca3af' : d > 0 ? '#16a34a' : d < 0 ? '#ef4444' : '#d97706';
      var dv = d === null ? '-' : d > 0 ? '+' + d.toFixed(2) : d.toFixed(2);
      pRows += '<div class="pt-row">' +
        '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#374151">' + p.ins + '</span>' +
        '<span style="text-align:center;color:#6b7280">' + (p.car || '-') + '</span>' +
        '<span style="text-align:center;color:#6b7280">' + (p.uti || '-') + '</span>' +
        '<span style="text-align:center;font-weight:700;color:' + dc + '">' + dv + '</span></div>';
    }
    var tbl = pRows ? '<div class="prod-table"><div class="pt-head"><span>Producto</span>' +
      '<span style="text-align:center">Cargado</span><span style="text-align:center">Utilizado</span>' +
      '<span style="text-align:center">Diferencia</span></div>' + pRows + '</div>' : '';
    var obs = r.obs ? '<div class="obs-wrap"><div class="obs-ttl">Observaciones</div>' +
      '<div class="obs-body">' + r.obs.replace(/\n/g, '<br>') + '</div></div>' : '';
    html += '<div class="reg-card">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">' +
        '<div><div class="reg-lote">' + r.lote + '</div>' +
        '<div class="reg-meta">' + r.fecha + hora + '</div></div>' +
        '<span class="badge ' + bc + '">' + r.tipo + '</span></div>' +
      tbl + obs +
      '<div class="reg-actions">' +
        '<button type="button" class="btn-act btn-p" data-id="' + r.id + '">&#8595; PDF</button>' +
        '<button type="button" class="btn-act btn-d" data-id="' + r.id + '">Eliminar</button>' +
      '</div></div>';
  }
  w.innerHTML = html;

  // Bind historial buttons
  var pdfBtns = w.querySelectorAll('.btn-p');
  for (var bi = 0; bi < pdfBtns.length; bi++) {
    pdfBtns[bi].addEventListener('click', (function(id) {
      return function() { expOne(id); };
    })(parseInt(pdfBtns[bi].getAttribute('data-id'))));
  }
  var delBtns = w.querySelectorAll('.btn-d');
  for (var di = 0; di < delBtns.length; di++) {
    delBtns[di].addEventListener('click', (function(id) {
      return function() { del(id); };
    })(parseInt(delBtns[di].getAttribute('data-id'))));
  }
}

function del(id) {
  if (!confirm('Eliminar este registro?')) return;
  recs = recs.filter(function(r) { return r.id !== id; });
  localStorage.setItem('lj_recs', JSON.stringify(recs));
  updTab();
  renderHist();
}

function mkPDF(list) {
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({ unit: 'mm', format: 'a4' });
  var pw = doc.internal.pageSize.getWidth();
  for (var ri = 0; ri < list.length; ri++) {
    var r = list[ri];
    if (ri > 0) doc.addPage();
    doc.setFillColor(22, 101, 52); doc.rect(0, 0, pw, 34, 'F');
    try { doc.addImage(LOGO_DATA, 'JPEG', 8, 5, 22, 22); } catch(e) {}
    doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(255, 255, 255);
    doc.text('LA JOSEFINA SRL', 34, 13);
    doc.setFontSize(8); doc.setTextColor(187, 247, 208);
    doc.text('Registro de Operaciones - Campana 26/27', 34, 20);
    doc.setDrawColor(74, 222, 128); doc.setLineWidth(0.3); doc.line(8, 28, pw - 8, 28);
    doc.setFillColor(240, 253, 244); doc.roundedRect(8, 38, pw - 16, 24, 2, 2, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(22, 101, 52);
    doc.text(r.lote, 14, 48);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(100, 116, 100);
    doc.text('Fecha: ' + r.fecha + (r.horario ? ' - ' + r.horario + 'hs' : ''), 14, 56);
    doc.setFont('helvetica', 'bold');
    doc.text('Tipo: ' + r.tipo, 14, 62);
    var filtProds = (r.prods || []).filter(function(p) { return p.ins; });
    if (filtProds.length > 0) {
      doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(22, 101, 52);
      doc.text('PRODUCTOS', 14, 74);
      var rows = [];
      for (var pi = 0; pi < filtProds.length; pi++) {
        var p = filtProds[pi];
        var c = parseFloat(p.car), u = parseFloat(p.uti);
        var d = (!isNaN(c) && !isNaN(u)) ? (c - u) : null;
        var dStr = d === null ? '-' : d > 0 ? '+' + d.toFixed(2) : d.toFixed(2);
        rows.push([p.ins, p.car || '-', p.uti || '-', dStr]);
      }
      doc.autoTable({
        startY: 77,
        head: [['Producto', 'Cargado', 'Utilizado', 'Diferencia']],
        body: rows,
        theme: 'grid',
        headStyles: { fillColor: [22, 101, 52], textColor: [255, 255, 255], fontSize: 8, fontStyle: 'bold' },
        bodyStyles: { fontSize: 8, textColor: [55, 65, 81] },
        alternateRowStyles: { fillColor: [240, 253, 244] },
        columnStyles: { 1: { cellWidth: 30, halign: 'center' }, 2: { cellWidth: 30, halign: 'center' }, 3: { cellWidth: 26, halign: 'center' } },
        margin: { left: 8, right: 8 },
        didParseCell: function(data) {
          if (data.section === 'body' && data.column.index === 3) {
            var v = data.cell.raw;
            if (v && v.charAt(0) === '+') data.cell.styles.textColor = [22, 101, 52];
            else if (v && v !== '-') data.cell.styles.textColor = [220, 38, 38];
          }
        }
      });
    }
    if (r.obs) {
      var y = filtProds.length > 0 ? doc.lastAutoTable.finalY + 8 : 74;
      var lines = doc.splitTextToSize(r.obs, pw - 36);
      var bh = 14 + lines.length * 5;
      doc.setFillColor(240, 253, 244); doc.setDrawColor(74, 222, 128); doc.setLineWidth(0.3);
      doc.roundedRect(8, y, pw - 16, bh, 2, 2, 'FD');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(22, 101, 52);
      doc.text('OBSERVACIONES', 14, y + 7);
      doc.setFont('helvetica', 'normal'); doc.setTextColor(75, 85, 99);
      doc.text(lines, 14, y + 13);
    }
    var fy = doc.internal.pageSize.getHeight() - 8;
    doc.setFillColor(22, 101, 52); doc.rect(0, fy - 4, pw, 12, 'F');
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7); doc.setTextColor(187, 247, 208);
    doc.text('La Josefina SRL - Registro de Operaciones - Campana 26/27', pw / 2, fy + 2, { align: 'center' });
  }
  return doc;
}

function expOne(id) {
  var r = null;
  for (var i = 0; i < recs.length; i++) { if (recs[i].id === id) { r = recs[i]; break; } }
  if (!r) return;
  mkPDF([r]).save('LJ_' + r.lote.replace(/[^a-zA-Z0-9]/g, '_') + '_' + r.fecha + '.pdf');
}

function expAll() {
  if (!recs.length) { alert('No hay registros.'); return; }
  var f = document.getElementById('hist-filt').value;
  var list = f ? recs.filter(function(r) { return r.lote === f; }) : recs;
  if (!list.length) { alert('No hay registros con el filtro.'); return; }
  mkPDF(list).save('LJ_Registros_' + new Date().toISOString().slice(0, 10) + '.pdf');
}

// Arrancar cuando el DOM está listo
window.addEventListener('DOMContentLoaded', init);
</script>
</body>
