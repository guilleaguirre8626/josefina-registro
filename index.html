<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LA JOSEFINA SRL - Registro de Operaciones</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f4f7f4;font-family:'Inter',sans-serif;color:#1a2e1a;font-size:14px;}
.header{background:#fff;border-bottom:3px solid #16a34a;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:0 20px;}
.hi{max-width:700px;margin:0 auto;}
.brand-row{display:flex;align-items:center;gap:16px;padding:16px 0 12px;}
.logo-img{width:60px;height:60px;object-fit:contain;}
.brand-name{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:3px;color:#15803d;}
.brand-sub{font-size:11px;color:#86b893;margin-top:2px;}
.brand-title{font-size:12px;font-weight:600;color:#166534;margin-top:4px;padding-top:4px;border-top:1px solid #d1fae5;}
.tabs{display:flex;border-top:1px solid #eee;}
.tab{flex:1;cursor:pointer;border:none;background:none;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;padding:11px;color:#6b7280;border-bottom:3px solid transparent;transition:all .2s;type:button;}
.tab.on{color:#16a34a;border-bottom:3px solid #16a34a;}
.main{max-width:700px;margin:0 auto;padding:20px;}
.card{background:#fff;border:1px solid #d1fae5;border-radius:10px;padding:20px;margin-bottom:14px;}
.ctit{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#16a34a;display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.nbadge{background:#f0fdf4;color:#22c55e;font-family:'Bebas Neue',sans-serif;font-size:22px;width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;}
.lbl{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#6b7280;display:block;margin-bottom:5px;}
.inp{width:100%;background:#f9fafb;border:1.5px solid #e5e7eb;border-radius:8px;padding:10px 14px;color:#111827;font-family:'Inter',sans-serif;font-size:14px;}
.inp:focus{border-color:#16a34a;outline:none;background:#fff;}
select.inp{background-color:#f9fafb;}
textarea.inp{resize:vertical;min-height:80px;line-height:1.5;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.tipog{display:flex;gap:10px;}
.tbtn{flex:1;padding:11px;border-radius:8px;border:1.5px solid #e5e7eb;background:#f9fafb;color:#6b7280;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;text-align:center;}
.tbtn:hover{border-color:#16a34a;color:#16a34a;background:#f0fdf4;}
.tbtn.tot{background:#f0fdf4;border-color:#16a34a;color:#15803d;}
.tbtn.sel{background:#fffbeb;border-color:#d97706;color:#b45309;}
.prodcard{background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;margin-bottom:12px;overflow:visible;}
.prodtop{padding:14px 14px 0 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.prodnr{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#86efac;}
.btnrm{background:#fef2f2;border:1px solid #fca5a5;border-radius:6px;color:#ef4444;font-size:12px;font-weight:600;padding:4px 10px;cursor:pointer;}
.prodbusq{padding:0 14px 12px 14px;border-bottom:1px solid #e5e7eb;}
.busqinp{width:100%;background:#fff;border:1.5px solid #e5e7eb;border-radius:8px;padding:10px 14px;font-family:'Inter',sans-serif;font-size:14px;color:#111827;}
.busqinp:focus{border-color:#16a34a;outline:none;}
.busqdrop{display:none;background:#fff;border:1.5px solid #16a34a;border-radius:8px;margin-top:4px;max-height:180px;overflow-y:auto;box-shadow:0 4px 16px rgba(0,0,0,.12);}
.busqitem{padding:9px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid #f0fdf4;color:#374151;}
.busqitem:hover{background:#f0fdf4;color:#16a34a;}
.prodcants{padding:12px 14px 14px 14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.cantlbl{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#6b7280;display:block;margin-bottom:5px;}
.cantinp{width:100%;background:#fff;border:2px solid #86efac;border-radius:8px;padding:10px 12px;font-family:'Inter',sans-serif;font-size:15px;font-weight:500;color:#111827;text-align:center;}
.cantinp:focus{border-color:#16a34a;outline:none;box-shadow:0 0 0 3px rgba(22,163,74,.15);}
.difbox{background:#f9fafb;border:2px solid #e5e7eb;border-radius:8px;padding:10px 12px;font-size:15px;font-weight:700;text-align:center;color:#9ca3af;min-height:43px;display:flex;align-items:center;justify-content:center;}
.btnadd{width:100%;background:#f0fdf4;border:1.5px dashed #4ade80;border-radius:8px;color:#16a34a;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;padding:10px;cursor:pointer;}
.btnadd:hover{background:#dcfce7;}
.btnsave{width:100%;background:linear-gradient(135deg,#15803d,#16a34a);border:none;border-radius:10px;color:#fff;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:15px;cursor:pointer;}
.btnsave:disabled{opacity:.4;cursor:not-allowed;}
.hint{text-align:center;font-size:11px;color:#9ca3af;margin-top:8px;}
.view{display:none;}.view.on{display:block;}
.regcard{background:#fff;border:1px solid #d1fae5;border-radius:10px;padding:16px;margin-bottom:10px;}
.reglote{font-weight:700;font-size:15px;color:#15803d;}
.regmeta{font-size:11px;color:#9ca3af;margin-top:2px;}
.badge{font-size:10px;font-weight:600;padding:4px 12px;border-radius:20px;}
.bt{background:#dcfce7;color:#15803d;border:1px solid #86efac;}
.bs{background:#fef3c7;color:#b45309;border:1px solid #fcd34d;}
.pth{display:grid;grid-template-columns:1fr 70px 70px 70px;gap:6px;font-size:10px;font-weight:600;color:#9ca3af;text-transform:uppercase;margin-bottom:4px;padding:0 4px;}
.ptr{display:grid;grid-template-columns:1fr 70px 70px 70px;gap:6px;font-size:12px;padding:5px 4px;border-bottom:1px solid #f9fafb;align-items:center;}
.obsblk{margin-top:10px;border-top:1px solid #f0fdf4;padding-top:10px;}
.obstit{font-size:10px;font-weight:600;color:#16a34a;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
.obstxt{font-size:12px;color:#4b5563;line-height:1.5;background:#f0fdf4;border-left:3px solid #4ade80;border-radius:0 6px 6px 0;padding:8px 12px;}
.regact{display:flex;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid #f0fdf4;}
.bact{background:none;border:1.5px solid;border-radius:7px;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;padding:6px 14px;cursor:pointer;}
.bpdf{border-color:#86efac;color:#15803d;}.bpdf:hover{background:#f0fdf4;}
.bdel{border-color:#fca5a5;color:#ef4444;}.bdel:hover{background:#fef2f2;}
.fbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
.bexp{background:#f0fdf4;border:1.5px solid #86efac;border-radius:8px;color:#15803d;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;padding:8px 16px;cursor:pointer;}
.empty{text-align:center;padding:50px 0;color:#9ca3af;}
.etit{font-family:'Bebas Neue',sans-serif;font-size:44px;color:#d1fae5;margin-bottom:6px;}
#toast{position:fixed;bottom:24px;right:24px;background:#15803d;border-radius:10px;padding:14px 24px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9999;}
#toast.on{opacity:1;}
.ttit{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#fff;letter-spacing:3px;}
.tsub{font-size:10px;color:#bbf7d0;margin-top:2px;text-transform:uppercase;letter-spacing:2px;}
</style>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getDatabase, ref, push, onValue, remove, set } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

    // CONFIG - el usuario pega sus datos aqui
    const firebaseConfig = {
      apiKey: "AIzaSyDzNalPBWQ9euT1MxAGqabr5uRu0lNR9Ks",
      authDomain: "registro-prod-fito.firebaseapp.com",
      databaseURL: "https://registro-prod-fito-default-rtdb.firebaseio.com",
      projectId: "registro-prod-fito",
      storageBucket: "registro-prod-fito.firebasestorage.app",
      messagingSenderId: "738297117416",
      appId: "1:738297117416:web:99949afaa74aa09a80275d",
      measurementId: "G-GJDN64XHX9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'registros');

    // Exponer funciones al scope global
    window.fbPush = function(reg) {
      return push(dbRef, reg);
    };

    window.fbDelete = function(fbKey) {
      return remove(ref(db, 'registros/' + fbKey));
    };

    window.fbListen = function(callback) {
      onValue(dbRef, function(snapshot) {
        var lista = [];
        snapshot.forEach(function(child) {
          var r = child.val();
          r._fbKey = child.key;
          lista.push(r);
        });
        // Ordenar por fecha descendente
        lista.sort(function(a,b){ return b.id - a.id; });
        callback(lista);
      });
    };

    // Importar registros locales (una sola vez)
    window.importarLocales = function() {
      var locales = JSON.parse(localStorage.getItem('lj_v4') || '[]');
      if (!locales.length) {
        alert('No hay registros locales para importar.');
        return;
      }
      if (!confirm('Se van a importar ' + locales.length + ' registros a la nube. Continuar?')) return;
      var promesas = locales.map(function(r) {
        return push(dbRef, r);
      });
      Promise.all(promesas).then(function() {
        localStorage.removeItem('lj_v4');
        alert('Importacion completada. Los registros locales fueron eliminados.');
      }).catch(function(e) {
        alert('Error al importar: ' + e.message);
      });
    };

    window.fbReady = true;
    console.log('Firebase conectado');
  </script>

<body>

<div class="header">
  <div class="hi">
    <div class="brand-row">
      <img class="logo-img" id="logo-img" src="" alt="La Josefina SRL"/>
      <div>
        <div class="brand-name">LA JOSEFINA SRL</div>
        <div class="brand-sub">Campana 26 / 27</div>
        <div class="brand-title">Registro de Operaciones</div>
      </div>
    </div>
    <div class="tabs">
      <button type="button" class="tab on" id="tab-form" onclick="showTab('form')">+ Nueva Operacion</button>
      <button type="button" class="tab" id="tab-hist" onclick="showTab('hist')">Historial</button>
    </div>
  </div>
</div>

<div class="main">

  <div id="view-form" class="view on">

    <div class="card">
      <div class="ctit"><span class="nbadge">01</span> Fecha y Horario</div>
      <div class="g2">
        <div><label class="lbl">Fecha</label><input type="date" class="inp" id="f-fecha"/></div>
        <div><label class="lbl">Horario</label><input type="time" class="inp" id="f-horario"/></div>
      </div>
    </div>

    <div class="card">
      <div class="ctit"><span class="nbadge">02</span> Lote</div>
      <label class="lbl">Seleccionar lote</label>
      <select class="inp" id="f-lote"><option value="">-- Elegir lote --</option></select>
    </div>

    <div class="card">
      <div class="ctit"><span class="nbadge">03</span> Tipo de Aplicacion</div>
      <div class="tipog">
        <button type="button" class="tbtn" id="btn-tot" onclick="setTipo('Total')">Total</button>
        <button type="button" class="tbtn" id="btn-sel" onclick="setTipo('Selectiva')">Selectiva</button>
      </div>
    </div>

    <div class="card">
      <div class="ctit"><span class="nbadge">04</span> Productos</div>
      <div id="prods-wrap"></div>
      <button type="button" class="btnadd" onclick="agregarProd()">+ Agregar producto</button>
    </div>

    <div class="card">
      <div class="ctit"><span class="nbadge">05</span> Observaciones</div>
      <label class="lbl">Notas (opcional)</label>
      <textarea class="inp" id="f-obs" placeholder="Condiciones climaticas, incidencias..."></textarea>
    </div>

    <button type="button" class="btnsave" id="btn-save" disabled onclick="guardar()">Guardar Registro</button>
    <p class="hint" id="hint">Completa fecha, lote y tipo para guardar</p>

  </div>

  <div id="view-hist" class="view">
    <div style="background:#fffbeb;border:1px solid #fcd34d;border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px" id="import-banner">
    <span style="font-size:12px;color:#b45309;font-weight:500">Tenes registros guardados localmente?</span>
    <button type="button" onclick="if(window.importarLocales)window.importarLocales();else alert('Firebase no listo todavia, espera unos segundos.');" style="background:#d97706;border:none;border-radius:6px;color:#fff;font-family:Inter,sans-serif;font-size:11px;font-weight:600;padding:7px 14px;cursor:pointer">Importar a la nube</button>
  </div>
  <div class="fbar">
      <span style="font-size:12px;color:#9ca3af;font-weight:500" id="hcnt">0 registros</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <select class="inp" style="min-width:180px" id="hfilt" onchange="mostrarHist()"><option value="">Todos los lotes</option></select>
        <button type="button" class="bexp" onclick="expTodos()">Exportar PDF</button>
      </div>
    </div>
    <div id="hist-wrap"></div>
  </div>

</div>

<div id="toast"><div class="ttit">OK</div><div class="tsub">Registro guardado</div></div>

var recs = []; // Los datos vienen de Firebase en tiempo real

// Init
window.onload = function() {
  var s1 = document.getElementById('f-lote');
  var s2 = document.getElementById('hfilt');
  for (var i = 0; i < LOTES.length; i++) {
    var o1 = document.createElement('option'); o1.value = LOTES[i]; o1.textContent = LOTES[i]; s1.appendChild(o1);
    var o2 = document.createElement('option'); o2.value = LOTES[i]; o2.textContent = LOTES[i]; s2.appendChild(o2);
  }
  document.getElementById('f-fecha').value = new Date().toISOString().slice(0,10);
  document.getElementById('f-lote').onchange = chkSave;
  document.getElementById('f-fecha').oninput = chkSave;
  agregarProd();

  // Escuchar Firebase en tiempo real
  var intentos = 0;
  var esperar = setInterval(function() {
    intentos++;
    if (window.fbListen) {
      clearInterval(esperar);
      window.fbListen(function(lista) {
        recs = lista;
        updTab();
        // Si el historial esta visible, refrescarlo
        if (document.getElementById('view-hist').classList.contains('on')) {
          mostrarHist();
        }
      });
    } else if (intentos > 30) {
      clearInterval(esperar);
      document.getElementById('hint').textContent = 'Error: Firebase no conectado. Verifica la configuracion.';
    }
  }, 300);
};

function showTab(t) {
  document.getElementById('view-form').className = 'view' + (t==='form'?' on':'');
  document.getElementById('view-hist').className = 'view' + (t==='hist'?' on':'');
  document.getElementById('tab-form').className = 'tab' + (t==='form'?' on':'');
  document.getElementById('tab-hist').className = 'tab' + (t==='hist'?' on':'');
  if (t === 'hist') mostrarHist();
}

function setTipo(t) {
  tipo = t;
  document.getElementById('btn-tot').className = 'tbtn' + (t==='Total'?' tot':'');
  document.getElementById('btn-sel').className = 'tbtn' + (t==='Selectiva'?' sel':'');
  chkSave();
}

  nr.textContent = '#01';
  var btnrm = document.createElement('button');

  btnrm.className = 'btnrm';
  btnrm.textContent = 'Quitar';
  btnrm.onclick = (function(n){ return function(){ quitarProd(n); }; })(idx);
  top.appendChild(nr);
  top.appendChild(btnrm);
  card.appendChild(top);

  // Buscador
  var busqDiv = document.createElement('div');
  busqDiv.className = 'prodbusq';
  var busqLbl = document.createElement('span');
  busqLbl.className = 'lbl';
  busqLbl.textContent = 'Insumo / Producto';
  var busqInp = document.createElement('input');
  busqInp.type = 'text';
  busqInp.className = 'busqinp';
  busqInp.id = 'bi-' + idx;
  busqInp.placeholder = 'Escribi para buscar...';
  busqInp.autocomplete = 'off';
  var drop = document.createElement('div');
  drop.className = 'busqdrop';
  drop.id = 'bd-' + idx;

  busqInp.oninput = (function(n){ return function(){ buscar(n); }; })(idx);
  busqInp.onclick = (function(n){ return function(){ buscar(n); }; })(idx);

  busqDiv.appendChild(busqLbl);
  busqDiv.appendChild(busqInp);
  busqDiv.appendChild(drop);
  card.appendChild(busqDiv);

  // Cantidades - div separado, sin ninguna relacion con el buscador
  var cDiv = document.createElement('div');
  cDiv.className = 'prodcants';

  // Cargado
  var d1 = document.createElement('div');
  var l1 = document.createElement('span'); l1.className = 'cantlbl'; l1.textContent = 'Cargado (L/kg)';
  var i1 = document.createElement('input');
  i1.type = 'text';
  i1.className = 'cantinp';
  i1.id = 'can-' + idx;
  i1.placeholder = '0.00';
  i1.oninput = (function(n){ return function(){ calcDif(n); }; })(idx);
  d1.appendChild(l1); d1.appendChild(i1);

  // Utilizado
  var d2 = document.createElement('div');
  var l2 = document.createElement('span'); l2.className = 'cantlbl'; l2.textContent = 'Utilizado (L/kg)';
  var i2 = document.createElement('input');
  i2.type = 'text';
  i2.className = 'cantinp';
  i2.id = 'uti-' + idx;
  i2.placeholder = '0.00';
  i2.oninput = (function(n){ return function(){ calcDif(n); }; })(idx);
  d2.appendChild(l2); d2.appendChild(i2);

  // Diferencia
  var d3 = document.createElement('div');
  var l3 = document.createElement('span'); l3.className = 'cantlbl'; l3.textContent = 'Diferencia';
  var dif = document.createElement('div');
  dif.className = 'difbox';
  dif.id = 'dif-' + idx;
  dif.textContent = '-';
  d3.appendChild(l3); d3.appendChild(dif);

  cDiv.appendChild(d1); cDiv.appendChild(d2); cDiv.appendChild(d3);
  card.appendChild(cDiv);

  document.getElementById('prods-wrap').appendChild(card);
  renumerar();
}

function buscar(idx) {
  var inp = document.getElementById('bi-' + idx);
  var drop = document.getElementById('bd-' + idx);
  if (!inp || !drop) return;
  var q = inp.value.toLowerCase().trim();
  drop.innerHTML = '';
  if (!q) { drop.style.display = 'none'; return; }
  var hits = [];
  for (var j = 0; j < INSUMOS.length; j++) {
    if (INSUMOS[j].toLowerCase().indexOf(q) !== -1) { hits.push(INSUMOS[j]); if (hits.length >= 14) break; }
  }
  if (!hits.length) { drop.style.display = 'none'; return; }
  for (var k = 0; k < hits.length; k++) {
    var item = document.createElement('div');
    item.className = 'busqitem';
    item.textContent = hits[k];
    item.onmousedown = (function(val, n){ return function(e){ e.preventDefault(); document.getElementById('bi-'+n).value = val; document.getElementById('bd-'+n).style.display='none'; }; })(hits[k], idx);
    drop.appendChild(item);
  }
  drop.style.display = 'block';
}

// Cerrar dropdowns al hacer click en cualquier otro lugar
document.addEventListener('click', function(e) {
  for (var n = 0; n < pc; n++) {
    var bi = document.getElementById('bi-' + n);
    var bd = document.getElementById('bd-' + n);
    if (bi && bd && !bi.contains(e.target) && !bd.contains(e.target)) {
      bd.style.display = 'none';
    }
  }
});

function calcDif(idx) {
  var c = parseFloat((document.getElementById('can-'+idx)||{value:''}).value.replace(',','.'));
  var u = parseFloat((document.getElementById('uti-'+idx)||{value:''}).value.replace(',','.'));
  var box = document.getElementById('dif-'+idx);
  if (!box) return;
  if (isNaN(c) || isNaN(u)) { box.textContent = '-'; box.style.color = '#9ca3af'; return; }
  var d = c - u;
  box.textContent = d > 0 ? '+'+d.toFixed(2) : d.toFixed(2);
  box.style.color = d > 0 ? '#16a34a' : d < 0 ? '#ef4444' : '#d97706';
}

function quitarProd(idx) {
  var c = document.querySelectorAll('.prodcard');
  if (c.length <= 1) return;
  var el = document.getElementById('pc-card-' + idx);
  if (el) el.remove();
  renumerar();
}

function renumerar() {
  var c = document.querySelectorAll('.prodcard');
  for (var i = 0; i < c.length; i++) {
    var n = c[i].querySelector('[id^="pnr-"]');
    if (n) n.textContent = '#' + (i+1 < 10 ? '0'+(i+1) : ''+(i+1));
  }
}

function chkSave() {
  var ok = document.getElementById('f-fecha').value && document.getElementById('f-lote').value && tipo;
  document.getElementById('btn-save').disabled = !ok;
  document.getElementById('hint').style.display = ok ? 'none' : 'block';
}

function guardar() {
  var prods = [];
  var cards = document.querySelectorAll('.prodcard');
  for (var ci = 0; ci < cards.length; ci++) {
    var cid = cards[ci].id.replace('pc-card-','');
    var ins = (document.getElementById('bi-'+cid)||{value:''}).value.trim();
    var car = (document.getElementById('can-'+cid)||{value:''}).value.replace(',','.').trim();
    var uti = (document.getElementById('uti-'+cid)||{value:''}).value.replace(',','.').trim();
    if (ins || car || uti) prods.push({ins:ins,car:car,uti:uti});
  }
  var reg = {
    id: Date.now(),
    fecha: document.getElementById('f-fecha').value,
    horario: document.getElementById('f-horario').value,
    lote: document.getElementById('f-lote').value,
    tipo: tipo, prods: prods,
    obs: document.getElementById('f-obs').value.trim()
  };
  if (window.fbPush) {
    window.fbPush(reg).then(function() {
      showToast(); resetForm();
    }).catch(function(e) {
      alert('Error al guardar: ' + e.message);
    });
  } else {
    alert('Firebase no conectado. Verifica la configuracion.');
  }
}

function resetForm() {
  document.getElementById('f-fecha').value = new Date().toISOString().slice(0,10);
  document.getElementById('f-horario').value = '';
  document.getElementById('f-lote').value = '';
  document.getElementById('f-obs').value = '';
  tipo = '';
  document.getElementById('btn-tot').className = 'tbtn';
  document.getElementById('btn-sel').className = 'tbtn';
  document.getElementById('prods-wrap').innerHTML = '';
  pc = 0; agregarProd(); chkSave();
}

function showToast() {
  var t = document.getElementById('toast');
  t.classList.add('on');
  setTimeout(function(){ t.classList.remove('on'); }, 2000);
}

function updTab() {
  document.getElementById('tab-hist').textContent = 'Historial' + (recs.length ? ' ('+recs.length+')' : '');
}

function mostrarHist() {
  var f = document.getElementById('hfilt').value;
  var list = f ? recs.filter(function(r){ return r.lote===f; }) : recs;
  document.getElementById('hcnt').textContent = list.length + ' registro' + (list.length!==1?'s':'');
  var w = document.getElementById('hist-wrap');
  if (!list.length) {
    w.innerHTML = '<div class="empty"><div class="etit">SIN DATOS</div><p>'+(f?'No hay registros para este lote':'Todavia no hay registros guardados')+'</p></div>';
    return;
  }
  var html = '';
  for (var ri = 0; ri < list.length; ri++) {
    var r = list[ri];
    var hora = r.horario ? ' - ' + r.horario + 'hs' : '';
    var bc = r.tipo==='Total' ? 'bt' : 'bs';
    var prows = '';
    var fp = (r.prods||[]).filter(function(p){ return p.ins; });
    for (var pi = 0; pi < fp.length; pi++) {
      var p = fp[pi];
      var c = parseFloat(p.car), u = parseFloat(p.uti);
      var d = (!isNaN(c)&&!isNaN(u)) ? (c-u) : null;
      var dc = d===null?'#9ca3af':d>0?'#16a34a':d<0?'#ef4444':'#d97706';
      var dv = d===null?'-':d>0?'+'+d.toFixed(2):d.toFixed(2);
      prows += '<div class="ptr"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+p.ins+'</span>'
        +'<span style="text-align:center;color:#6b7280">'+(p.car||'-')+'</span>'
        +'<span style="text-align:center;color:#6b7280">'+(p.uti||'-')+'</span>'
        +'<span style="text-align:center;font-weight:700;color:'+dc+'">'+dv+'</span></div>';
    }
    var tbl = prows ? '<div style="margin-top:10px;border-top:1px solid #f0fdf4;padding-top:8px">'
      +'<div class="pth"><span>Producto</span><span style="text-align:center">Cargado</span>'
      +'<span style="text-align:center">Utilizado</span><span style="text-align:center">Diferencia</span></div>'
      +prows+'</div>' : '';
    var obs = r.obs ? '<div class="obsblk"><div class="obstit">Observaciones</div>'
      +'<div class="obstxt">'+r.obs.replace(/\n/g,'<br>')+'</div></div>' : '';
    html += '<div class="regcard">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">'
      +'<div><div class="reglote">'+r.lote+'</div><div class="regmeta">'+r.fecha+hora+'</div></div>'
      +'<span class="badge '+bc+'">'+r.tipo+'</span></div>'
      +tbl+obs
      +'<div class="regact">'
      +'<button type="button" class="bact bpdf" data-id="'+r.id+'">PDF</button>'
      +'<button type="button" class="bact bdel" data-id="'+r.id+'">Eliminar</button>'
      +'</div></div>';
  }
  w.innerHTML = html;
  var pb = w.querySelectorAll('.bpdf');
  for (var bi=0; bi<pb.length; bi++) pb[bi].onclick = (function(id){ return function(){ expUno(id); }; })(parseInt(pb[bi].getAttribute('data-id')));
  var db = w.querySelectorAll('.bdel');
  for (var di=0; di<db.length; di++) db[di].onclick = (function(id){ return function(){ eliminar(id); }; })(parseInt(db[di].getAttribute('data-id')));
}

function eliminar(id) {
  if (!confirm('Eliminar este registro?')) return;
  var r = recs.find(function(x){ return x.id === id; });
  if (r && r._fbKey && window.fbDelete) {
    window.fbDelete(r._fbKey).catch(function(e){ alert('Error: ' + e.message); });
  }
}

function mkPDF(list) {
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({unit:'mm',format:'a4'});
  var pw = doc.internal.pageSize.getWidth();
  for (var ri=0; ri<list.length; ri++) {
    var r = list[ri];
    if (ri>0) doc.addPage();
    doc.setFillColor(22,101,52); doc.rect(0,0,pw,34,'F');
    try { doc.addImage(LOGO,'JPEG',8,5,22,22); } catch(e){}
    doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(255,255,255);
    doc.text('LA JOSEFINA SRL',34,13);
    doc.setFontSize(8); doc.setTextColor(187,247,208);
    doc.text('Registro de Operaciones - Campana 26/27',34,20);
    doc.setDrawColor(74,222,128); doc.setLineWidth(0.3); doc.line(8,28,pw-8,28);
    doc.setFillColor(240,253,244); doc.roundedRect(8,38,pw-16,24,2,2,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(22,101,52);
    doc.text(r.lote,14,48);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(100,116,100);
    doc.text('Fecha: '+r.fecha+(r.horario?' - '+r.horario+'hs':''),14,56);
    doc.setFont('helvetica','bold');
    doc.text('Tipo: '+r.tipo,14,62);
    var fp=(r.prods||[]).filter(function(p){return p.ins;});
    if (fp.length>0) {
      doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(22,101,52);
      doc.text('PRODUCTOS',14,74);
      var rows=[];
      for (var pi=0;pi<fp.length;pi++) {
        var p=fp[pi],c=parseFloat(p.car),u=parseFloat(p.uti);
        var d=(!isNaN(c)&&!isNaN(u))?(c-u):null;
        rows.push([p.ins,p.car||'-',p.uti||'-',d===null?'-':d>0?'+'+d.toFixed(2):d.toFixed(2)]);
      }
      doc.autoTable({startY:77,head:[['Producto','Cargado','Utilizado','Diferencia']],body:rows,
        theme:'grid',headStyles:{fillColor:[22,101,52],textColor:[255,255,255],fontSize:8,fontStyle:'bold'},
        bodyStyles:{fontSize:8,textColor:[55,65,81]},alternateRowStyles:{fillColor:[240,253,244]},
        columnStyles:{1:{cellWidth:28,halign:'center'},2:{cellWidth:28,halign:'center'},3:{cellWidth:24,halign:'center'}},
        margin:{left:8,right:8},
        didParseCell:function(d){if(d.section==='body'&&d.column.index===3){var v=d.cell.raw;if(v&&v[0]==='+')d.cell.styles.textColor=[22,101,52];else if(v&&v!=='-')d.cell.styles.textColor=[220,38,38];}}
      });
    }
    if (r.obs) {
      var y=fp.length>0?doc.lastAutoTable.finalY+8:74;
      var lines=doc.splitTextToSize(r.obs,pw-36);
      doc.setFillColor(240,253,244);doc.setDrawColor(74,222,128);doc.setLineWidth(0.3);
      doc.roundedRect(8,y,pw-16,14+lines.length*5,2,2,'FD');
      doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(22,101,52);
      doc.text('OBSERVACIONES',14,y+7);
      doc.setFont('helvetica','normal');doc.setTextColor(75,85,99);
      doc.text(lines,14,y+13);
    }
    var fy=doc.internal.pageSize.getHeight()-8;
    doc.setFillColor(22,101,52);doc.rect(0,fy-4,pw,12,'F');
    doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(187,247,208);
    doc.text('La Josefina SRL - Registro de Operaciones - Campana 26/27',pw/2,fy+2,{align:'center'});
  }
  return doc;
}

function expUno(id) {
  var r=null; for(var i=0;i<recs.length;i++){if(recs[i].id===id){r=recs[i];break;}}
  if(!r)return;
  mkPDF([r]).save('LJ_'+r.lote.replace(/[^a-zA-Z0-9]/g,'_')+'_'+r.fecha+'.pdf');
}
function expTodos() {
  if(!recs.length){alert('No hay registros.');return;}
  var f=document.getElementById('hfilt').value;
  var list=f?recs.filter(function(r){return r.lote===f;}):recs;
  if(!list.length){alert('No hay registros con el filtro.');return;}
  mkPDF(list).save('LJ_Registros_'+new Date().toISOString().slice(0,10)+'.pdf');
}
</script>
